resources:
  jobs:
    pipeline_job:
      name: "med_asset_bundle_CICD-${var.environment}-pipeline"
      description: "Data Pipeline using Databricks Asset Bundles and CI/CD: Bronze → Silver → Gold"
      
      permissions:
        - level: CAN_VIEW
          group_name: users
          
      tasks:
        # -------- BRONZE --------
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/bronze.ipynb
 
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 3600
          max_retries: 2
 
        # -------- SILVER --------
        - task_key: silver
          notebook_task:
            notebook_path: ../src/silver.ipynb
 
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 1800
          max_retries: 2
 
          depends_on:
            - task_key: bronze
 
        # -------- GOLD --------
        - task_key: gold
          notebook_task:
            notebook_path: ../src/gold.ipynb
 
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 1200
          max_retries: 1
 
          depends_on:
            - task_key: silver
 
      max_concurrent_runs: 1
      timeout_seconds: 14400
 
      tags:
        environment: "${var.environment}"
        layer: "complete"
        pipeline: "creditcard-fraud"