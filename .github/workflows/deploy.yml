name: Deploy Med Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3️⃣ Install Databricks CLI (NEW VERSION)
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | bash

      # 4️⃣ Configure Databricks (FINAL SAFE VERSION)
      - name: Configure Databricks
        run: |
          echo DATABRICKS_HOST=${{ secrets.DATABRICKS_HOST }} >> $GITHUB_ENV
          echo DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }} >> $GITHUB_ENV

      # 5️⃣ Validate bundle
      - name: Validate Bundle
        run: databricks bundle validate

      # 6️⃣ Deploy bundle
      - name: Deploy Med Pipeline
        run: databricks bundle deploy --target dev

      # # 7️⃣ Run pipeline
      # - name: Run Pipeline
      #   run: databricks bundle run --target dev pipeline_job

      # 7️⃣ Install jq (for parsing JSON)
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 8️⃣ Get Job ID (SAFE & CLEAN)
      - name: Get Job ID
        run: |
          JOB_ID=$(databricks jobs list --output json | jq -r '.jobs[] | select(.settings.name=="med_creditcard-dev-pipeline") | .job_id')
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV

      # 9️⃣ Run Pipeline (VISIBLE IN UI)
      - name: Run Pipeline
        run: |
          databricks jobs run-now --job-id $JOB_ID