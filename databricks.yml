## Databricks Asset Bundle Configuration
## ETL Pipeline: Credit Card Fraud Detection
## Targets: Dev and Production environments
 
bundle:
  name: med_pipeline
 
include:
  - ./resources/pipeline_job.yml
sync:
  include:
    - ./src**
 
variables:
  environment:
    description: "Environment name"
    default: "dev"
 
  workspace_path:
    description: "Workspace path for pipeline files"
    default: "Shared/.bundle/med_pipeline"
 
targets:
  dev:
    variables:
      environment: "dev"
      workspace_path: "Shared/.bundle/med_pipeline/dev"
   
    workspace:
      host: "https://adb-7488500312027058.18.azuredatabricks.net"
      # profile: "DEFAULT"
      root_path: "/Shared/.bundle/med_pipeline/dev/${workspace.current_user.userName}"
 
